// 클라이언트와 서버가 주고받는 메시지. 이 파일이 원본이다.
// 프레임 형식은 docs/protocol.md 참고.
// P1 범위만 담았다. 전투, 보상 메시지는 해당 단계에서 추가한다.
syntax = "proto3";

package trymmo.proto;

import "common.proto";

option csharp_namespace = "TryMmo.Protocol";
option optimize_for = LITE_RUNTIME;

// 프레임 헤더의 메시지 ID. C2S는 클라이언트 → 서버, S2C는 서버 → 클라이언트.
// 번호는 구간별로 나눈다. 입장 1000번대, 월드 2000번대, 전투 3000번대, 성장 4000번대.
enum MsgId {
  MSG_ID_UNSPECIFIED = 0;

  // 입장
  C2S_ENTER_REQ = 1000;
  S2C_ENTER_RES = 1001;

  // 월드
  C2S_MOVE_REQ = 2000;
  S2C_ENTITY_SPAWN = 2001;
  S2C_ENTITY_DESPAWN = 2002;
  S2C_POSITION_SYNC = 2003;

  // 전투
  C2S_TARGET_REQ = 3000;
  S2C_COMBAT_RESULT = 3001;
  S2C_PLAYER_DEATH = 3002;
  S2C_REQUEST_REJECTED = 3003;

  // 성장
  S2C_REWARD = 4000;
}

// 개체의 정적 정보와 등장 시점의 위치.
message EntityInfo {
  uint32 entity_id = 1;
  EntityType type = 2;
  string name = 3;
  int32 max_hp = 4;
  Vec2 position = 5;
  EntityState state = 6;
}

// ---------- 입장 ----------

enum EnterResult {
  ENTER_RESULT_UNSPECIFIED = 0;
  ENTER_RESULT_OK = 1;
  ENTER_RESULT_ZONE_FULL = 2;
}

// 입장 요청. 필드 없음. 임시 ID는 서버가 접속 순서대로 부여한다.
message EnterReq {}

// 입장 응답. 실패하면 result만 유효하고 서버는 연결을 유지한다.
message EnterRes {
  EnterResult result = 1;
  EntityInfo self = 2;
  uint32 server_tick = 3;
  PlayerStats stats = 4;
}

// ---------- 월드 ----------

enum DespawnReason {
  DESPAWN_REASON_UNSPECIFIED = 0;
  DESPAWN_REASON_LEFT = 1;        // 연결 끊김
  DESPAWN_REASON_OUT_OF_AOI = 2;  // 이탈 거리 800 초과
  DESPAWN_REASON_DIED = 3;        // 슬라임 사망. 리스폰하면 EntitySpawn이 다시 온다
}

// 이동 요청. 새 요청은 이전 목적지를 덮어쓴다.
// 맵 밖 좌표는 응답 없이 무시되고 서버 로그에 남는다.
message MoveReq {
  Vec2 destination = 1;
}

// 입장 또는 AOI 진입으로 개체가 보이기 시작할 때 보낸다.
message EntitySpawn {
  EntityInfo entity = 1;
}

// 이탈 또는 AOI 이탈로 개체가 보이지 않게 될 때 보낸다.
message EntityDespawn {
  uint32 entity_id = 1;
  DespawnReason reason = 2;
}

message EntityPosition {
  uint32 entity_id = 1;
  Vec2 position = 2;
  EntityState state = 3;
  int32 hp = 4;
  int32 level = 5;
  int32 max_hp = 6;  // 레벨업으로 바뀌므로 스냅샷에도 보낸다
}

// 틱마다 보내는 AOI 안 전체 스냅샷. 자기 자신을 포함한다.
message PositionSync {
  uint32 server_tick = 1;
  repeated EntityPosition entities = 2;
}

// ---------- 전투 ----------

// 대상 지정. 접근과 타격은 서버가 처리한다.
// 이동 요청, 대상 사망, 대상 복귀 시작, 플레이어 사망으로 대상이 해제된다.
message TargetReq {
  uint32 target_id = 1;
}

// 타격 한 번의 결과. 공격자나 대상이 AOI 안에 있는 플레이어가 받는다.
// 대상이 슬라임이고 target_hp가 0이면 이어서 EntityDespawn(DIED)이 온다.
message CombatResult {
  uint32 attacker_id = 1;
  uint32 target_id = 2;
  int32 damage = 3;
  int32 target_hp = 4;
}

// 플레이어 사망. revive_tick에 입장 위치에서 부활한다.
message PlayerDeath {
  uint32 entity_id = 1;
  uint32 revive_tick = 2;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_TARGET_NOT_FOUND = 1;
  REJECT_REASON_TARGET_DEAD = 2;
  REJECT_REASON_TARGET_RETURNING = 3;
}

// 요청 거부. 사망 중 입력과 맵 밖 이동은 이 메시지 없이 무시된다.
message RequestRejected {
  MsgId request = 1;
  RejectReason reason = 2;
}

// ---------- 성장 ----------

// 플레이어 본인의 성장 상태. 프로토타입은 저장하지 않으므로 입장 때 항상 초기값이다.
message PlayerStats {
  int32 level = 1;
  int32 exp = 2;           // 현재 레벨에서 쌓은 EXP
  int32 required_exp = 3;  // 다음 레벨까지 필요한 EXP. 최고 레벨이면 0
  int32 gold = 4;
  int32 max_hp = 5;
  int32 attack = 6;
  int32 defense = 7;
}

// 처치 보상. 기여자 본인에게만 보낸다. stats는 지급 후 값이다.
// 슬라임의 CombatResult, EntityDespawn 뒤에 온다.
message Reward {
  uint32 slime_id = 1;
  int32 exp_gained = 2;   // 최고 레벨이면 0
  int32 gold_gained = 3;
  int32 levels_gained = 4;
  PlayerStats stats = 5;
}