// try_mmo 프로토타입 메시지 스키마. 이 파일이 원본이다.
// 프레임 형식은 docs/protocol.md 참고.
// P1 범위만 담았다. 전투, 보상 메시지는 해당 단계에서 추가한다.
syntax = "proto3";

package trymmo;

option csharp_namespace = "TryMmo.Protocol";
option optimize_for = LITE_RUNTIME;

// 프레임 헤더의 메시지 ID. C2S는 클라이언트 → 서버, S2C는 서버 → 클라이언트.
enum MsgId {
  MSG_ID_UNSPECIFIED = 0;
  C2S_ENTER_REQ = 1;
  S2C_ENTER_RES = 2;
  C2S_MOVE_REQ = 3;
  S2C_ENTITY_SPAWN = 4;
  S2C_ENTITY_DESPAWN = 5;
  S2C_POSITION_SYNC = 6;
}

// 서버 좌표. 원점은 좌측 하단, X는 오른쪽, Y는 위쪽 증가.
message Vec2 {
  float x = 1;
  float y = 2;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_PLAYER = 1;
}

enum EntityState {
  ENTITY_STATE_UNSPECIFIED = 0;
  ENTITY_STATE_IDLE = 1;
  ENTITY_STATE_MOVING = 2;
}

enum EnterResult {
  ENTER_RESULT_UNSPECIFIED = 0;
  ENTER_RESULT_OK = 1;
  ENTER_RESULT_ZONE_FULL = 2;
}

enum DespawnReason {
  DESPAWN_REASON_UNSPECIFIED = 0;
  DESPAWN_REASON_LEFT = 1;        // 연결 끊김
  DESPAWN_REASON_OUT_OF_AOI = 2;  // 이탈 거리 800 초과
}

// 개체의 정적 정보와 등장 시점의 위치.
message EntityInfo {
  uint32 entity_id = 1;
  EntityType type = 2;
  string name = 3;
  int32 max_hp = 4;
  Vec2 position = 5;
  EntityState state = 6;
}

// 입장 요청. 필드 없음. 임시 ID는 서버가 접속 순서대로 부여한다.
message EnterReq {}

// 입장 응답. 실패하면 result만 유효하고 서버는 연결을 유지한다.
message EnterRes {
  EnterResult result = 1;
  EntityInfo self = 2;
  uint32 server_tick = 3;
}

// 이동 요청. 새 요청은 이전 목적지를 덮어쓴다.
// 맵 밖 좌표는 응답 없이 무시되고 서버 로그에 남는다.
message MoveReq {
  Vec2 destination = 1;
}

// 입장 또는 AOI 진입으로 개체가 보이기 시작할 때 보낸다.
message EntitySpawn {
  EntityInfo entity = 1;
}

// 이탈 또는 AOI 이탈로 개체가 보이지 않게 될 때 보낸다.
message EntityDespawn {
  uint32 entity_id = 1;
  DespawnReason reason = 2;
}

message EntityPosition {
  uint32 entity_id = 1;
  Vec2 position = 2;
  EntityState state = 3;
}

// 틱마다 보내는 AOI 안 전체 스냅샷. 자기 자신을 포함한다.
message PositionSync {
  uint32 server_tick = 1;
  repeated EntityPosition entities = 2;
}
