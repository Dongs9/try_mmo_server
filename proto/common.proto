// 메시지 전반에서 함께 쓰는 공용 타입.
syntax = "proto3";

package trymmo.proto;

option csharp_namespace = "TryMmo.Protocol";
option optimize_for = LITE_RUNTIME;

// 서버 좌표. 원점은 좌측 하단, X는 오른쪽, Y는 위쪽 증가.
message Vec2 {
  float x = 1;
  float y = 2;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_PLAYER = 1;
  ENTITY_TYPE_SLIME = 2;
}

enum EntityState {
  ENTITY_STATE_UNSPECIFIED = 0;
  ENTITY_STATE_IDLE = 1;
  ENTITY_STATE_MOVING = 2;
  ENTITY_STATE_RETURNING = 3;  // 슬라임 복귀 중. 대상 지정, 피격 불가
  ENTITY_STATE_DEAD = 4;
  ENTITY_STATE_STUNNED = 5;  // 슬라임 기절 중. 이동과 공격 정지, 피격 가능
  ENTITY_STATE_ROLLING = 6;  // 플레이어 구르기 중
}
